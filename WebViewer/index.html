<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新加坡滨海湾 · 离线三维城市</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04090b; }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* ---------- POI label overlay ---------- */
  #labels {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .poi-label {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 5px;
    pointer-events: auto;
    cursor: pointer;
    white-space: nowrap;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #d8f6ff;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.95);
    user-select: none;
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .poi-label i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5eead4;
    box-shadow: 0 0 8px #2dd4bf;
    flex: none;
  }
  .poi-label span { font-size: 12px; line-height: 1; letter-spacing: 0.2px; }
  .poi-label.tier0 { color: #ffffff; }
  .poi-label.tier0 i { width: 8px; height: 8px; background: #ffd166; box-shadow: 0 0 10px #ffb020; }
  .poi-label.tier0 span { font-size: 14px; font-weight: 600; }
  .poi-label.tier2 { opacity: 0; }
  .poi-label.tier2 i { width: 4px; height: 4px; background: #7dd3fc; box-shadow: 0 0 5px #38bdf8; }
  .poi-label.tier2 span { font-size: 10px; color: #bfe6ff; }

  /* day-mode (dark engineering palette) label styling: light text, dark halo */
  body.day .poi-label { color: #e8f6ff; text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.95); }
  body.day .poi-label i { background: #ffd166; box-shadow: 0 0 8px rgba(255, 176, 32, 0.8); }
  body.day .poi-label.tier0 { color: #ffffff; }
  body.day .poi-label.tier0 i { background: #ffd166; box-shadow: 0 0 10px #ffb020; }
  body.day .poi-label.tier2 span { color: #bfe6ff; text-shadow: 0 0 5px rgba(0, 0, 0, 0.95); }
  body.day .poi-label.tier2 i { background: #7dd3fc; box-shadow: 0 0 5px #38bdf8; }

  /* ---------- along-road name labels ---------- */
  .road-label {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
    white-space: nowrap;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.4px;
    color: #a8d8cf;
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.95);
    user-select: none;
    opacity: 0;
    transition: opacity 0.18s ease;
    display: none;
  }
  .road-label.tier0 { font-size: 12px; font-weight: 600; color: #cdeee6; }
  .road-label.tier2 { font-size: 10px; color: #8fb8b2; }
  body.day .road-label {
    color: #dbeafe;
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.95);
  }
  body.day .road-label.tier0 { color: #ffffff; }
  body.day .road-label.tier2 { color: #a9c4d8; }

  /* ---------- left info panel ---------- */
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 248px;
    padding: 14px 16px;
    background: rgba(6, 18, 22, 0.82);
    border: 1px solid rgba(45, 212, 191, 0.25);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    color: #cfe8e4;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    user-select: none;
    z-index: 6;
  }
  #panel h1 {
    font-size: 15px;
    font-weight: 600;
    color: #5eead4;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  #status {
    font-size: 12px;
    color: #8fb8b2;
    margin-bottom: 10px;
  }
  #status.ok { color: #5eead4; }
  #status.error { color: #f87171; }
  #layers {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0;
    border-top: 1px solid rgba(45, 212, 191, 0.15);
    border-bottom: 1px solid rgba(45, 212, 191, 0.15);
  }
  .layer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .layer-row input[type="checkbox"] {
    accent-color: #2dd4bf;
    width: 14px;
    height: 14px;
  }
  #stats {
    margin-top: 10px;
    font-size: 12px;
    color: #7aa8a2;
    font-variant-numeric: tabular-nums;
  }
  #help {
    margin-top: 8px;
    font-size: 11px;
    color: #587a75;
  }

  /* ---------- top-right controls ---------- */
  #controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 6;
  }
  #search {
    width: 210px;
    padding: 9px 11px;
    background: rgba(6, 18, 22, 0.82);
    border: 1px solid rgba(45, 212, 191, 0.28);
    border-radius: 8px;
    color: #cfe8e4;
    font-size: 13px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    outline: none;
    backdrop-filter: blur(8px);
  }
  #search::placeholder { color: #587a75; }
  #search:focus { border-color: rgba(45, 212, 191, 0.6); }
  .ctrl-btn {
    padding: 9px 14px;
    background: rgba(6, 18, 22, 0.82);
    border: 1px solid rgba(45, 212, 191, 0.35);
    border-radius: 8px;
    color: #5eead4;
    font-size: 13px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    cursor: pointer;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: rgba(45, 212, 191, 0.7); }

  /* ---------- highlight overlay (selected road / place) ---------- */
  #highlight {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }

  /* ---------- right road-filter panel (engineering simulation) ---------- */
  #road-panel {
    position: fixed;
    top: 64px;
    right: 16px;
    bottom: 16px;
    width: 268px;
    display: flex;
    flex-direction: column;
    padding: 12px 12px 10px;
    background: rgba(6, 18, 22, 0.86);
    border: 1px solid rgba(45, 212, 191, 0.25);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    color: #cfe8e4;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    z-index: 6;
  }
  #road-panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: #5eead4;
    margin-bottom: 4px;
  }
  #road-panel .rp-sub { font-size: 11px; color: #7aa8a2; margin-bottom: 8px; }
  #road-filter {
    width: 100%;
    padding: 7px 9px;
    background: rgba(4, 12, 15, 0.9);
    border: 1px solid rgba(45, 212, 191, 0.28);
    border-radius: 7px;
    color: #cfe8e4;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    margin-bottom: 8px;
  }
  #road-filter:focus { border-color: rgba(45, 212, 191, 0.6); }
  #road-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(45, 212, 191, 0.4) transparent;
  }
  .road-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 7px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    text-align: left;
    background: none;
    color: #cfe8e4;
    font-family: inherit;
    font-size: 12px;
    width: 100%;
  }
  .road-row:hover { background: rgba(45, 212, 191, 0.12); }
  .road-row.active {
    background: rgba(255, 176, 32, 0.16);
    border-color: rgba(255, 176, 32, 0.65);
    color: #ffd166;
  }
  .road-row .tag {
    flex: none;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(96, 165, 250, 0.18);
    color: #93c5fd;
  }
  .road-row .tag.t0 { background: rgba(255, 176, 32, 0.18); color: #ffd166; }
  .road-row .tag.t1 { background: rgba(45, 212, 191, 0.16); color: #5eead4; }
  .road-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #road-clear {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(4, 12, 15, 0.9);
    border: 1px solid rgba(45, 212, 191, 0.3);
    border-radius: 7px;
    color: #8fb8b2;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  #road-clear:hover { color: #5eead4; border-color: rgba(45, 212, 191, 0.6); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="highlight"></canvas>
<div id="labels"></div>
<div id="panel">
  <h1>新加坡滨海湾 · 离线三维城市</h1>
  <div id="status">正在初始化…</div>
  <div id="layers"></div>
  <div id="stats"></div>
  <div id="help">左键拖拽 旋转 · 右键拖拽 平移 · 滚轮 缩放 · 双击 复位视角</div>
</div>
<div id="controls">
  <input id="search" list="search-list" placeholder="搜索地名并飞往…" autocomplete="off">
  <button id="search-btn" class="ctrl-btn">前往</button>
  <button id="tod-toggle" class="ctrl-btn">☀️ 白天</button>
  <datalist id="search-list"></datalist>
</div>
<div id="road-panel">
  <h2>已修建道路 · 工程筛选</h2>
  <div class="rp-sub">点击道路高亮并飞往 · 用于新建道路工程对照</div>
  <input id="road-filter" placeholder="筛选路名 / 编号…" autocomplete="off">
  <div id="road-list"></div>
  <button id="road-clear">清除高亮</button>
</div>
<script src="/WebViewer/glb.js"></script>
<script src="/WebViewer/viewer.js"></script>
</body>
</html>
